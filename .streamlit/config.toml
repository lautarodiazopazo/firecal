# Tema Firechron: colores de la guía de marca de NASA Space Apps (https://www.spaceappschallenge.org/brand/)
[theme]
base = "dark"
primaryColor = "#EAFE07"
backgroundColor = "#07173F"
secondaryBackgroundColor = "#0B2257"
textColor = "#FFFFFF"
linkColor = "#2E96F5"
borderColor = "#0960E1"
baseRadius = "10px"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 50
